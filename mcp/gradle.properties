# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=com.dwinovo.numen
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Numen MCP
mod_author=dwinovo
mod_id=numen_mcp
license=MIT
credits=
description=Exposes Numen companions as an MCP (Model Context Protocol) server, so an external agent like Claude can list, take control of, and directly drive companion bodies — calling their tools without the built-in LLM. Hand-rolled JSON-RPC over the JDK HTTP server; zero third-party dependencies (Gson is on the MC classpath).
minecraft_version_range=[26.1.2, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.148.2+26.1.2
fabric_loader_version=0.19.2

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.50-beta
neoforge_loader_version_range=[4,)

# Zero third-party runtime deps: the MCP server is hand-rolled JSON-RPC over the
# JDK's built-in HTTP server (com.sun.net.httpserver) + Gson (on the MC classpath).

# Local maven repo the numen-api engine is published into (co-dev on this machine).
# Overridable with -Plocal_maven_url=... ; the buildSrc repos fall back to the public
# raw maven for fresh clones. build 27+ of the 26.1.2 engine lives here.
local_maven_url=file:///F:/Projects/numen/numen-maven

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
