# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.0.3
group=com.dwinovo.numen
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Ensoul
mod_author=dwinovo
mod_id=numen
license=LGPL-3.0-only
credits=Vonish; derivative of Dwinovo's open-source Numen
description=They were never NPCs. Ensoul gives Minecraft living companions: LLM-driven agents with real bodies - reflexes, muscles, gaze, append-only memory and hard-won lessons. Summon one, talk to it, and it lives alongside you: pathfinding, mining, building, combat, crafting, and a little life of its own. Derivative of Dwinovo's open-source Numen.
minecraft_version_range=[26.1.2, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.148.2+26.1.2
fabric_loader_version=0.19.2

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.50-beta
neoforge_loader_version_range=[4,)

# LLM transport uses java.net.http.HttpClient (JDK built-in, Java 11+) and
# Gson (already on the MC classpath). No third-party HTTP / SDK dependencies.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
